<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BLOG</title>
        <style>
            header {
                background-color: #183C63;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            }

            main {
                background-color: #FFFFFF;
                color: #201616;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
                align-items: center;
                gap: 16px;
            }      
            
            img {
                width: 80px;
                height: 80px;
                object-fit: cover;
                border-radius: 8px;
            }

            div h2 {
                margin: 0 0 4px 0;
            }

            div p {
                margin: 4px 0;
            }

            .artigo-autor {
                font-weight: bold;
            }

            /* Estilização do botão de reação */
            button {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-top: 8px;
                padding: 6px 12px;
                border: 1px solid #ccc;
                border-radius: 20px;
                background-color: #f9f9f9;
                cursor: pointer;
                font-size: 14px;
            }

            button:hover {
                background-color: #e2e2e2;
            }
        </style>
    </head>
    <body>
        <header>  
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimentos sobre tecnologia e programação.</p>
        </header>
        <main>
            <img src="imagem-blog.png" alt="Logotipo conceitual de tecnologia e educação">
            
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Lorena Araujo</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
                
                <!-- Botão de reação adicionado com contador em span -->
                <button>❤️ <span>0</span></button>
            </div>
        </main>

        <!-- Script responsável pela interação do clique e incremento -->
        <script>
            const botao = document.querySelector("button");

            botao.addEventListener("click", botaoClicado);

            function botaoClicado() {
                let texto = botao.querySelector("span");
                texto.textContent++;
            }
        </script>
    </body>
</html>
