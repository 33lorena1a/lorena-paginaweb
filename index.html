<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Tech</title>
    <style>
        body {
            background-color: #f4f6f9;
            color: #222222;
            font-family: sans-serif;
            margin: 0;
            padding: 20px 0;
        }

        header {
            background-color: #183c63;
            color: #FFFFFF;
            text-align: center;
            max-width: 1000px;
            margin: 0 auto 16px auto;
            padding: 16px;
            border: 5px solid #4a90e2;
            box-sizing: border-box;
        }

        main {
            background-color: #FFFFFF;
            color: #183c63;
            max-width: 1000px;
            margin: auto;
            padding: 16px;
            display: flex;
            flex-direction: row;
            gap: 16px;
            box-sizing: border-box;
        }

        article {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            padding: 16px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            color: #222222;
            box-sizing: border-box;
        }

        article h2 {
            color: #183c63;
            margin-top: 12px;
            font-size: 1.2rem;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .artigo-autor {
            font-weight: bold;
            color: #183c63;
            margin: 8px 0;
        }

        .artigo-fonte {
            font-size: 0.85rem;
            color: #666666;
            font-style: italic;
            margin-top: 8px;
        }

        .botoes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: auto;
            padding-top: 12px;
        }

        button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid #4a90e2;
            border-radius: 20px;
            background-color: #ffffff;
            color: #183c63;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #e8f1f5;
        }

        button.ativo {
            background-color: #4a90e2;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            header, main {
                margin-left: 16px;
                margin-right: 16px;
            }

            main {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação.</p>
    </header>

    <main>
        <article>
            <img src="imagem-blog.png" alt="Ícone de livro tecnológico azul com capelo sobre ele.">
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Lorena Silva Araujo</p>
                <p>Boas-vindas ao meu novo blog!<br><br>Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
                <p class="artigo-fonte">Fonte: Elaboração própria</p>
            </div>
            <div class="botoes-container">
                <button aria-label="Amei">❤️ <span>0</span></button>
                <button aria-label="Gostei">👍 <span>0</span></button>
                <button aria-label="Não gostei">👎 <span>0</span></button>
                <button aria-label="Comentários">💬 <span>0</span></button>
            </div>
        </article>
    </main>
</body>

</html>
