<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BLOG</title>
        <style>
            header {
                background-color: #183C63;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            }

            main {
                background-color: #FFFFFF;
                color: #201616;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex; /* Alinha a imagem e o texto lado a lado */
                align-items: center; /* Alinha verticalmente ao centro */
                gap: 16px; /* Espaço entre imagem e texto */
            }      
            
            img {
                width: 80px;
                height: 80px;
                object-fit: cover;
                border-radius: 8px;
            }

            /* Reduz margens padrão do título e parágrafos para alinhar bem com a imagem */
            div h2 {
                margin: 0 0 4px 0;
            }

            div p {
                margin: 4px 0;
            }

            /* Estilo para destacar o autor */
            .artigo-autor {
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>  
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimentos sobre tecnologia e programação.</p>
        </header>
        <main>
            <img src="imagem-blog.png" alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpadas de ideia. Cores em tons de azul e branco">
            
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Lorena Araujo</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
            </div>
        </main>
    </body>
</html>
